<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            border: 3px dashed #2196F3;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #1976D2;
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .upload-section.dragover {
            border-color: #1976D2;
            background: #e3f2fd;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            color: #2196F3;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.3);
        }

        .webcam-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .webcam-btn:hover {
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.3);
        }

        .image-preview {
            text-align: center;
            margin: 20px 0;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .webcam-container {
            text-align: center;
            margin: 20px 0;
        }

        #webcam {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .results {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
            border-left: 5px solid #2196F3;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .result-label {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .result-confidence {
            font-weight: bold;
            color: #2196F3;
            font-size: 1.2rem;
        }

        .confidence-bar {
            width: 200px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 15px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2196F3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        .error {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .confidence-bar {
                width: 100px;
            }
            
            .result-item {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Classifier</h1>
            <p>Upload een afbeelding of gebruik je webcam voor real-time classificatie</p>
        </div>
        
        <div class="main-content">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📷</div>
                <h3>Sleep een afbeelding hierheen of klik om te uploaden</h3>
                <p style="margin: 10px 0; color: #666;">Ondersteunde formaten: JPG, PNG, GIF</p>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    📂 Kies Bestand
                </button>
                <button class="upload-btn webcam-btn" onclick="toggleWebcam()">
                    🎥 Webcam
                </button>
            </div>

            <div class="image-preview" id="imagePreview"></div>
            
            <div class="webcam-container" id="webcamContainer" style="display: none;">
                <div id="webcam"></div>
                <div class="controls">
                    <button class="btn" onclick="stopWebcam()">Stop Webcam</button>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Model wordt geladen...</p>
            </div>

            <div id="results" class="results" style="display: none;">
                <h3>🎯 Classificatie Resultaten</h3>
                <div id="resultsList"></div>
            </div>

            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        let model;
        let webcam;
        let isWebcamActive = false;
        let maxPredictions;

        // Model URL - pas deze aan naar je eigen model locatie
        const URL = './my_model/';

        // Initialize the application
        async function init() {
            try {
                showLoading(true);
                const modelURL = URL + 'model.json';
                const metadataURL = URL + 'metadata.json';

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                showLoading(false);
                console.log('Model successfully loaded!');
            } catch (error) {
                showError('Fout bij het laden van het model. Zorg ervoor dat de model bestanden correct zijn geüpload.');
                console.error('Model loading error:', error);
                showLoading(false);
            }
        }

        // File upload handling
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        
        // Drag and drop functionality
        const uploadSection = document.getElementById('uploadSection');
        
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Selecteer alstublieft een geldige afbeelding.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                displayImage(e.target.result);
                classifyImage(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function displayImage(imageSrc) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `<img src="${imageSrc}" alt="Preview" class="preview-image">`;
            hideError();
        }

        async function classifyImage(imageSrc) {
            if (!model) {
                showError('Model is nog niet geladen. Probeer het over een paar seconden opnieuw.');
                return;
            }

            try {
                showLoading(true);
                
                // Create image element
                const image = new Image();
                image.onload = async function() {
                    const prediction = await model.predict(image);
                    displayResults(prediction);
                    showLoading(false);
                };
                image.src = imageSrc;
            } catch (error) {
                showError('Fout bij het classificeren van de afbeelding.');
                console.error('Classification error:', error);
                showLoading(false);
            }
        }

        async function toggleWebcam() {
            if (isWebcamActive) {
                stopWebcam();
            } else {
                await startWebcam();
            }
        }

        async function startWebcam() {
            if (!model) {
                showError('Model is nog niet geladen. Probeer het over een paar seconden opnieuw.');
                return;
            }

            try {
                const flip = true;
                webcam = new tmImage.Webcam(300, 300, flip);
                await webcam.setup();
                await webcam.play();
                
                document.getElementById('webcamContainer').style.display = 'block';
                document.getElementById('webcam').appendChild(webcam.canvas);
                document.getElementById('imagePreview').innerHTML = '';
                
                isWebcamActive = true;
                window.requestAnimationFrame(loop);
                hideError();
            } catch (error) {
                showError('Kan geen toegang krijgen tot de webcam. Controleer je browser permissies.');
                console.error('Webcam error:', error);
            }
        }

        async function loop() {
            if (isWebcamActive) {
                webcam.update();
                await predict();
                window.requestAnimationFrame(loop);
            }
        }

        async function predict() {
            try {
                const prediction = await model.predict(webcam.canvas);
                displayResults(prediction);
            } catch (error) {
                console.error('Prediction error:', error);
            }
        }

        function stopWebcam() {
            if (webcam) {
                webcam.stop();
                document.getElementById('webcamContainer').style.display = 'none';
                document.getElementById('results').style.display = 'none';
                isWebcamActive = false;
            }
        }

        function displayResults(predictions) {
            const resultsList = document.getElementById('resultsList');
            const results = document.getElementById('results');
            
            // Sort predictions by probability
            predictions.sort((a, b) => b.probability - a.probability);
            
            let resultsHTML = '';
            predictions.forEach((prediction, index) => {
                const percentage = (prediction.probability * 100).toFixed(1);
                const confidence = prediction.probability * 100;
                
                resultsHTML += `
                    <div class="result-item">
                        <span class="result-label">${prediction.className}</span>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidence}%"></div>
                        </div>
                        <span class="result-confidence">${percentage}%</span>
                    </div>
                `;
            });
            
            resultsList.innerHTML = resultsHTML;
            results.style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // Initialize the model when the page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
