<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .main-content { padding: 40px; }
        .upload-section {
            border: 3px dashed #2196F3;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-section:hover { background: #f0f4ff; border-color: #1976D2; }
        .file-input { display: none; }
        .upload-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px;
        }
        .webcam-btn { background: #4CAF50; }
        .image-preview { text-align: center; margin: 20px 0; }
        .preview-image { max-width: 100%; max-height: 300px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f1f3f5;
            border-radius: 15px;
            display: none;
        }
        .result-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }
        .result-label { flex: 1; font-weight: bold; }
        .confidence-bar { width: 150px; height: 10px; background: #ddd; border-radius: 5px; margin: 0 15px; overflow: hidden; }
        .confidence-fill { height: 100%; background: #2196F3; }
        .error { color: #d32f2f; background: #ffebee; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; text-align: center; }
        #webcam-container canvas { border-radius: 10px; width: 100% !important; height: auto !important; max-width: 400px; }
        .loading-spinner { display: none; text-align: center; margin: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤖 AI Product Classifier</h1>
        <p>Herken Chicken curry, Leek puff pastry, en meer!</p>
    </div>

    <div class="main-content">
        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem; margin-bottom: 10px;">📸</div>
            <h3>Klik om een foto te uploaden</h3>
            <p>Of gebruik de knoppen hieronder</p>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📂 Bestand Kiezen</button>
            <button class="upload-btn webcam-btn" id="webcamToggle" onclick="toggleWebcam()">🎥 Start Webcam</button>
        </div>

        <div id="loading" class="loading-spinner">Bezig met laden...</div>
        <div id="error" class="error"></div>

        <div id="image-preview" class="image-preview"></div>
        <div id="webcam-container" style="text-align: center;"></div>

        <div id="results" class="results">
            <h3 style="margin-bottom: 15px;">🎯 Resultaten:</h3>
            <div id="label-container"></div>
        </div>
    </div>
</div>

<script>
    // PAS DIT PAD AAN: Zorg dat je model.json in de map 'my_model' staat
    const MODEL_URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;
    let isWebcamActive = false;

    // Model laden bij opstarten
    async function init() {
        const loadingDiv = document.getElementById("loading");
        loadingDiv.style.display = "block";
        
        try {
            const modelURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            loadingDiv.style.display = "none";
            console.log("Model geladen!");
        } catch (e) {
            showError("Fout: Kan model niet laden. Zorg dat model.json in de map 'my_model' staat.");
            loadingDiv.style.display = "none";
        }
    }

    // Bestand uploaden afhandelen
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        if (isWebcamActive) stopWebcam();
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            const imgElement = document.createElement('img');
            imgElement.src = event.target.result;
            imgElement.classList.add('preview-image');
            
            const previewDiv = document.getElementById('image-preview');
            previewDiv.innerHTML = '';
            previewDiv.appendChild(imgElement);

            imgElement.onload = async () => {
                const prediction = await model.predict(imgElement);
                displayResults(prediction);
            };
        };
        reader.readAsDataURL(file);
    });

    // Webcam functies
    async function toggleWebcam() {
        const btn = document.getElementById("webcamToggle");
        if (isWebcamActive) {
            stopWebcam();
            btn.innerText = "🎥 Start Webcam";
            btn.style.background = "#4CAF50";
        } else {
            await startWebcam();
            btn.innerText = "🛑 Stop Webcam";
            btn.style.background = "#f44336";
        }
    }

    async function startWebcam() {
        try {
            isWebcamActive = true;
            document.getElementById('image-preview').innerHTML = '';
            webcam = new tmImage.Webcam(400, 400, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);
            document.getElementById("webcam-container").appendChild(webcam.canvas);
        } catch (e) {
            showError("Geen toegang tot webcam.");
        }
    }

    function stopWebcam() {
        isWebcamActive = false;
        if (webcam) webcam.stop();
        document.getElementById("webcam-container").innerHTML = '';
    }

    async function loop() {
        if (!isWebcamActive) return;
        webcam.update();
        const prediction = await model.predict(webcam.canvas);
        displayResults(prediction);
        window.requestAnimationFrame(loop);
    }

    function displayResults(predictions) {
        document.getElementById("results").style.display = "block";
        labelContainer.innerHTML = "";
        
        // Sorteer op hoogste score
        predictions.sort((a, b) => b.probability - a.probability);

        predictions.forEach(p => {
            const percentage = (p.probability * 100).toFixed(0);
            const row = `
                <div class="result-item">
                    <span class="result-label">${p.className}</span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${percentage}%"></div>
                    </div>
                    <span style="width: 40px; text-align: right;">${percentage}%</span>
                </div>`;
            labelContainer.innerHTML += row;
        });
    }

    function showError(msg) {
        const errDiv = document.getElementById("error");
        errDiv.innerText = msg;
        errDiv.style.display = "block";
    }

    // Start de applicatie
    init();
</script>
</body>
</html>
